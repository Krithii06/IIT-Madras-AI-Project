# Dependency and interpreter declaration for the Vercel serverless functions.
#
# requirements.txt alone was not enough: Vercel resolves dependencies with uv, and
# with only a .python-version file present it still selected CPython 3.14, for which
# onnxruntime publishes no wheel. requires-python here constrains the interpreter uv
# picks, which is the part that actually needed fixing.
#
# Keep the pins identical to requirements.txt - both are read depending on how the
# build is invoked.

[project]
name = "plant-disease-api"
version = "1.0.0"
description = "Serverless inference endpoints for the plant disease classifier"
requires-python = ">=3.12,<3.13"
dependencies = [
    "onnxruntime==1.20.1",
    "numpy==2.2.4",
    "pillow==11.1.0",
]
